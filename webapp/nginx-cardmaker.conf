    # SWCCG Card Maker (prototype): UI is static under /var/www/swccg.com/cardmaker/, API is the render container
    location /cardmaker/api/ {
        proxy_pass http://127.0.0.1:17010/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
